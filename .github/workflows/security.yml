# Guaranteed harness: inline hooks only exist in tools that support them
# (see README "Portable by design"); this workflow guards everything that
# reaches the repo, whoever (or whatever) pushed it. Same three scanners as
# the local layer (scripts/), plus a drift check on the generated per-tool
# bindings. Stack-agnostic by design — add your test/lint jobs alongside these.
name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history: leaked-then-removed secrets still count
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/secrets --error --metrics=off

  dependencies:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run osv-scanner
        # exit 128 = no supported lockfiles found — fine for a fresh template
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan -r . || [ $? -eq 128 ]

  adapters:
    name: Adapter drift (sync-adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: GAIDE_BINDINGS="$(python3 -c "import yaml;m=yaml.safe_load(open('gaide.yaml'))['modules'];print(','.join(b.split('-',1)[1].replace('claude-code','claude') for b in m if b.startswith('binding-')))")" scripts/sync-adapters.sh --check

  gaide:
    name: gaide gates (doctor, task-ref, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6 # TODO pin to the v6 commit SHA before merge (repo policy, ADR 0002)
      - name: Install the gaide CLI
        # Switch to `uv tool install gaide` once GAIDE_CLI is on PyPI.
        run: |
          uv tool install "git+https://github.com/Ecoa-PUC-Rio/GAIDE_CLI"
          gaide --version
      - name: Install the scanners the canaries exercise
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz && tar xzf gl.tgz gitleaks && sudo install -m755 gitleaks /usr/local/bin/
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 && sudo install -m755 osv-scanner /usr/local/bin/
          uv tool install semgrep
      - name: Drift between gaide.yaml and the generated files
        # Regenerate from the recorded choices; any diff means someone edited a
        # generated file instead of its source, or changed gaide.yaml by hand.
        # In the GAIDE repository itself the local modules/ are the template
        # (--template-path .); projects use the tag recorded in gaide.yaml.
        run: |
          if [ -d modules ]; then gaide init --yes --config gaide.yaml --template-path .; else gaide init --yes --config gaide.yaml; fi
          git diff --exit-code -- . ':!.gaide/manifest.json'
      - name: Doctor (canaries prove every installed gate blocks)
        run: gaide doctor --ci
      - name: Every PR commit touching src/ references an in-progress task
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            files="$(git diff-tree --no-commit-id --name-only -r "$sha" | paste -sd, -)"
            gaide check task-ref --message "$(git log -1 --format=%B "$sha")" --files "$files" || { echo "commit $sha"; exit 1; }
          done

  # Optional: IaC scanning for projects with Terraform / Dockerfiles / k8s
  # manifests. Uncomment to enable (same underscore-style convention as
  # .mcp.json — disabled until you opt in). Pin the action to a commit SHA
  # when enabling, as above.
