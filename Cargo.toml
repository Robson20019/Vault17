[workspace]
resolver = "2"
members = ["contracts/*"]
# Antigos tokens OpenZeppelin, substituídos por contracts/token (aluguel caro na testnet)
exclude = ["contracts/lot_token", "contracts/test_usdc"]

[workspace.dependencies]
soroban-sdk = "=26.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
