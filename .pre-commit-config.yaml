# Shares the harness with humans and with agents whose tool has no inline
# hooks: pre-commit runs the same gates as the CLI for anyone who commits
# (the commit-time guaranteed floor; see README "Portable by design").
# Install with: uv tool install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Update pinned revs periodically with: pre-commit autoupdate
repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.24.3
  hooks:
  - id: gitleaks
- repo: local
  hooks:
  - id: gaide-task-ref
    name: gaide check task-ref (commits touching src/ reference an in-progress task)
    entry: gaide check task-ref --message-file
    language: system
    stages:
    - commit-msg
    pass_filenames: true
    always_run: true
- repo: https://github.com/semgrep/pre-commit
  rev: v1.117.0
  hooks:
  - id: semgrep
    args:
    - scan
    - --config
    - p/security-audit
    - --config
    - p/secrets
    - --error
    - --metrics=off
    - --quiet
